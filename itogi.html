<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F5F2;color:#23201E;
  font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;padding:24px}
@media (prefers-color-scheme:dark){body{background:#171513;color:#F0ECE8}}
.box{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:32px 30px;
  box-shadow:0 1px 2px rgba(35,32,30,.04),0 8px 24px -20px rgba(35,32,30,.4)}
@media (prefers-color-scheme:dark){.box{background:#1F1C1A}}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 0 20px;font-size:14.5px;color:#867E78;line-height:1.5}
input{width:100%;padding:12px 14px;font:inherit;font-size:16px;border:1px solid #D3CBC2;
  border-radius:10px;background:transparent;color:inherit;margin-bottom:10px}
input:focus{outline:2px solid #6B3A48;outline-offset:1px;border-color:transparent}
button{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;
  background:#6B3A48;color:#FFF8F6;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:#A4432B;font-size:13.5px;min-height:19px;margin:8px 0 0}
</style></head>

  <form id="f" autocomplete="off">
    <input id="p" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
    <button id="b" type="submit">Открыть</button>
    <p class="err" id="e"></p>
  </form>
</div>

  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
  return new TextDecoder().decode(pt);
}
function render(html){document.open();document.write(html);document.close();}
async function tryPw(pw,silent){
  try{const html=await decrypt(pw); try{sessionStorage.setItem("sms_pw",pw);}catch(_){}
       render(html); return true;}
  catch(_){ if(!silent) document.getElementById("e").textContent="Неверный пароль"; return false; }
}
(async()=>{
  let saved=null; try{saved=sessionStorage.getItem("sms_pw");}catch(_){}
  if(saved) await tryPw(saved,true);
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const b=document.getElementById("b"); b.disabled=true; b.textContent="Расшифровка…";
  document.getElementById("e").textContent="";
  await tryPw(document.getElementById("p").value,false);
  b.disabled=false; b.textContent="Открыть";
});
